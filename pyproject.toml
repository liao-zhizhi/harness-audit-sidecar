[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-audit"
version = "0.8.1"
description = "Execution-layer audit sidecar for AI agent harnesses: four-valued verdicts judged against independently collected witnesses."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "liaozhizhi", email = "liaozhizhi@foxmail.com" }]

keywords = [
    "agents",
    "audit",
    "mcp",
    "json-rpc",
    "false-completion",
    "verification",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Framework dependencies are deliberately absent: the transport, the witness
# collectors and the verdict lattice are all standard library. PyYAML is the
# single exception, and it exists to keep *policy* out of the code -- see
# `audit_sidecar/judgment_base.py` for why that trade is worth a dependency.
dependencies = ["PyYAML>=5.1"]

[project.urls]
Repository = "https://github.com/liao-zhizhi/harness-audit-sidecar"
Issue-Tracker = "https://github.com/liao-zhizhi/harness-audit-sidecar/issues"

[project.optional-dependencies]
dev = []

[project.scripts]
# Console script used as the stdio sidecar for an agent client.
harness-audit-server = "audit_sidecar.mcp_server:main"

[tool.setuptools]
# Only the package itself: tests and scratch output are not part of the wheel.
packages = ["audit_sidecar", "audit_sidecar.tools"]

[tool.setuptools.package-data]
# py.typed marks the package as typed. rules/*.yaml ships the default policy
# inside the wheel, so a plain `pip install` produces a working audit gate
# instead of one that silently enforces nothing until configured.
audit_sidecar = ["py.typed", "rules/*.yaml"]
