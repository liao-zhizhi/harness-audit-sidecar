[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is the URL a developer types, so it is the product name:
# `pip install harness-audit-sidecar`. The import package stays `audit_sidecar`
# (a dist name and an import name are allowed to differ -- `beautifulsoup4` ->
# `bs4` -- and renaming the package would break every existing `import`).
#
# One name, chosen before the first upload. Two live names for one project is a
# permanent support cost, and "which one is on PyPI?" is a question nobody should
# have to ask about an audit tool.
name = "harness-audit-sidecar"
version = "0.10.3"
description = "Execution-layer audit sidecar for AI agent harnesses: four-valued verdicts judged against independently collected witnesses."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhizhi Liao", email = "liaozhizhi@foxmail.com" }]

keywords = [
    "agents",
    "audit",
    "mcp",
    "json-rpc",
    "false-completion",
    "verification",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Framework dependencies are deliberately absent: the transport, the witness
# collectors and the verdict lattice are all standard library. PyYAML is the
# single exception, and it exists to keep *policy* out of the code -- see
# `audit_sidecar/judgment_base.py` for why that trade is worth a dependency.
dependencies = ["PyYAML>=5.1"]

[project.urls]
Repository = "https://github.com/liao-zhizhi/harness-audit-sidecar"
Issue-Tracker = "https://github.com/liao-zhizhi/harness-audit-sidecar/issues"

[project.optional-dependencies]
dev = []

[project.scripts]
# Stdio sidecar. Bare invocation speaks MCP; `report` is dispatched to the
# same panel as `harness-audit report` (`audit_sidecar.trace_panel:run_report`).
harness-audit-server = "audit_sidecar.mcp_server:main"
# Developer-facing CLI: `harness-audit init` / `check` / `report`; bare
# `harness-audit` runs the demo.
harness-audit = "audit_sidecar.cli:main"

[tool.setuptools]
# Only the package itself: tests and scratch output are not part of the wheel.
packages = ["audit_sidecar", "audit_sidecar.tools"]

[tool.setuptools.package-data]
# py.typed marks the package as typed. rules/*.yaml ships the default policy
# inside the wheel, so a plain `pip install` produces a working audit gate
# instead of one that silently enforces nothing until configured.
audit_sidecar = ["py.typed", "rules/*.yaml"]
